name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        working-directory: souvenir-wasm
        run: bun install --frozen-lockfile
      # Pin upstream Binaryen: distro wasm-opt can reject current Rust Wasm instructions.
      - name: Install Binaryen
        env:
          BINARYEN_VERSION: "123"
        run: |
          set -euo pipefail
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/binaryen.tar.gz"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Report build tool versions
        run: |
          rustc --version
          wasm-opt --version
      - name: Build package
        working-directory: souvenir-wasm
        run: bun run build
      - name: Test JavaScript API
        working-directory: souvenir-wasm
        run: bun run test
      - name: Pack package
        working-directory: souvenir-wasm/dist
        run: bun pm pack
      - uses: actions/upload-artifact@v4
        with:
          name: souvenir-js
          path: souvenir-wasm/dist/*.tgz
