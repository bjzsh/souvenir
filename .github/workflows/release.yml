name: Release

# Publishes the crates to crates.io and souvenir.js to npm when a version
# tag (such as v0.7.0) is pushed. Needs two repository secrets:
# CARGO_REGISTRY_TOKEN and NPM_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag and run the tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Check that the tag matches the crate and package versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          crate="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "souvenir") | .version')"
          package="$(jq -r .version souvenir-js/package.json)"
          if [ "$version" != "$crate" ] || [ "$version" != "$package" ]; then
            echo "::error::tag $TAG, crate $crate and package $package do not agree"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (0.7.0-alpha.1) must not become npm's `latest`.
          case "$version" in
            *-*) echo "npm_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "npm_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Test the crates
        run: cargo test --locked --workspace --exclude souvenir-integration-tests --all-features
      - name: Test the package
        working-directory: souvenir-js
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
          bun run test

  crates:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # `souvenir` depends on this exact version of `souvenir-macros`, so the
      # macros go first; cargo waits until they are available.
      - name: Publish souvenir-macros
        run: cargo publish --locked -p souvenir-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish souvenir
        run: cargo publish --locked -p souvenir
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    defaults:
      run:
        working-directory: souvenir-js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `npm publish` runs `prepack`, which builds the package.
      - name: Publish souvenir.js
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
