name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [stable, beta, nightly, macos, win64, mingw]
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          - build: macos
            os: macos-latest
            rust: stable
          - build: win64
            os: windows-latest
            rust: stable-x86_64-pc-windows-msvc
          - build: mingw
            os: windows-latest
            rust: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-features
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update 1.86.0 --no-self-update
          rustup default 1.86.0
      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-features
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: |
        rustup update stable --no-self-update
        rustup default stable
        rustup component add clippy
    - name: Run formatter
      run: cargo fmt --all --check
    - name: Run clippy
      run: cargo clippy --locked --verbose --workspace --all-targets --all-features -- -D warnings

  features:
    name: Features (${{ matrix.features || 'minimal' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - macros
          - rand
          - serde
          - diesel,postgres
          - diesel,mysql
          - diesel,sqlite
          - sqlx,postgres
          - sqlx,mysql
          - sqlx,sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SQLite development library
        if: matrix.features == 'diesel,sqlite'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Test selected features
        run: cargo test --locked -p souvenir --no-default-features --features "${{ matrix.features }}"
      - name: Test minimal core
        if: matrix.features == ''
        run: cargo test --locked -p souvenir-core --no-default-features
