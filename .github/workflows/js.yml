name: JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: souvenir-js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build
      - name: Check types
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Load the built package in Node.js
        run: |
          node -e "const s = require('souvenir.js'); console.log(s.parse(s.newId('user')))"
          node --input-type=module -e "import { newId, parse } from 'souvenir.js'; console.log(parse(newId('user')))"
      - name: Pack package
        run: bun pm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: souvenir-js
          path: souvenir-js/*.tgz
