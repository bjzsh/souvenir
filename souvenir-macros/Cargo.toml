[package]
name = "souvenir-macros"
description = "Procedural macros for the `souvenir` crate. Use that crate instead of depending on this one."
include = ["src/**/*.rs", "LICENSE"]
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0.40"
syn = "2.0.106"


[dev-dependencies]
souvenir = { path = ".." }
