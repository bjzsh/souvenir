# Checked in CI by cargo-deny: known vulnerabilities, licenses and sources
# of every dependency, including the database integrations and dev tools.

[graph]
all-features = true

[advisories]
# A CVE in the C SQLite that libsqlite3-sys bundles, fixed in 0.39;
# sqlx-sqlite 0.9 accepts only versions below 0.38. It is in this
# repository's lockfile, used for tests; a program that depends on souvenir
# resolves its own versions.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.36, the newest sqlx-sqlite 0.9 and diesel 2.3 both accept" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# The database crates bring several versions of some small crates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
