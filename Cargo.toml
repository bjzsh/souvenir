[workspace]
members = [".", "souvenir-*", "integration-tests"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
authors = ["Brian Shao"]
license = "MIT"
repository = "https://github.com/bjzsh/souvenir"
rust-version = "1.87"
keywords = ["id", "identifier", "uuid", "prefix", "sortable"]
categories = ["data-structures", "encoding", "database"]

[package]
name = "souvenir"
description = "Type-safe, sortable, prefixed IDs like user_00t35pg1sg9ech32tymrkdq6v"
readme = "README.md"
include = ["src/**/*.rs", "tests/**/*", "benches/**/*.rs", "README.md", "SPEC.md", "LICENSE"]
keywords.workspace = true
categories.workspace = true

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["getrandom", "macros", "serde"]
all = ["getrandom", "macros", "diesel", "serde", "sqlx", "uuid", "postgres", "mysql", "sqlite"]

getrandom = ["dep:getrandom"]
macros = ["dep:souvenir-macros"]

# The database integrations store `Storage::Uuid` IDs through `uuid::Uuid`.
diesel = ["dep:diesel", "uuid"]
serde = ["dep:serde"]
sqlx = ["dep:sqlx", "uuid"]
uuid = ["dep:uuid"]

postgres = ["diesel?/postgres_backend", "sqlx?/postgres"]
mysql = ["diesel?/mysql_backend", "sqlx?/mysql"]
sqlite = ["diesel?/sqlite", "sqlx?/sqlite"]

# Never enabled (`cfg(any())` is false): pins `souvenir-macros` to this exact
# version even when the `macros` feature is off, so the two can't drift apart.
[target.'cfg(any())'.dependencies]
souvenir-macros = { workspace = true }

[workspace.dependencies]
souvenir-macros = { version = "=0.7.0", path = "souvenir-macros" }
souvenir = { version = "=0.7.0", path = "." }

[dependencies]
souvenir-macros = { workspace = true, optional = true }
getrandom = { version = "0.3.4", optional = true }
diesel = { version = "2.2.12", optional = true }
serde = { version = "1.0.219", optional = true }
sqlx = { version = "0.8.6", optional = true }
uuid = { version = "1.18", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
postcard = { version = "1.1", features = ["use-std"] }
proptest = "1.7"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "codec"
harness = false

[[test]]
name = "derive"
required-features = ["macros"]
